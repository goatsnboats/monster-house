# Site config: where things are on this house (ICD-015). Read by the brain and the eyes.
# House coordinates, meters: origin on the ground below the radar; x to the right as
# seen from the street, y from the house toward the street, z up.
# Positions are guesses until measured at install (TBD-018). Window sizes are the usable
# glass measured 2026-11-15 (ICD-011). Rotation waits for TBD-005.

radar:
  mount: {x: 0.0, y: 0.0, z: 1.2}          # TBD-018
  approach_range_m: 5.0
  # Where the radar loses a visitor walking up to the door (radar mm). A guess until
  # measured at the Stage 2 install (TBD-029); the fake radar's blind spot uses it.
  door_zone_mm: {x1: -1800, y1: 0, x2: -500, y2: 900}  # TBD-029
# Where the eyes look while a visitor is at the door (SHW-012), house meters: a guess at
# a kid's head in the middle of the door zone, until measured at install (TBD-029).
door_point: {x: -1.15, y: 0.45, z: 1.0}  # TBD-029
head_height_m: 1.0
eyes:
  left:                                     # as seen from the street: the smaller window
    position_m: {x: -1.6, y: -0.5, z: 5.0}  # TBD-018
    window_m: {w: 0.686, h: 1.219}          # 27 x 48 in
    rotate_deg: 90                          # TBD-005
    mirror: true
    eye_center: [0.5, 0.5]
    eye_size: 0.9                           # not used by the square shape
    brightness: 1.0
    eye_shape: square                       # square (fills the glass), oval or stretch
  right:
    position_m: {x: 1.6, y: -0.5, z: 5.0}   # TBD-018
    window_m: {w: 0.914, h: 1.219}          # 36 x 48 in
    rotate_deg: 0                           # TBD-005
    mirror: true
    eye_center: [0.5, 0.5]
    eye_size: 0.9                           # not used by the square shape
    brightness: 1.0
    eye_shape: square                       # square (fills the glass), oval or stretch
