# Monster House: Mosquitto broker for Stage 0 desktop development.
# Start it with:  deploy/mosquitto/run-dev.sh
#
# Localhost only, no password: the owner approved this for the prototype.
# Once eye pods are real Pis on the home network (Stage 1+), the broker must
# listen on the network with a username and password (architecture §3c);
# that will be a separate config file.

listener 1883 127.0.0.1
allow_anonymous true

# Keep nothing on disk. Retained messages (theme, mood) are lost when the
# broker restarts, which is fine for development.
persistence false

# Log to the terminal, including every client connect/disconnect.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %H:%M:%S
