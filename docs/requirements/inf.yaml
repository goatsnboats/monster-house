# INF Infrastructure subsystem requirements. Field meanings: README.md in this folder.
# INF holds the compute platform (the Pis), the site config, network, power and mounting.

# ── Compute platform ────────────────────────────────────────────────────────────

- id: INF-001
  text: >-
    Each eye Pi shall provide the platform specified in ICD-013: Raspberry Pi OS Lite
    (64-bit, Bookworm), Python 3.11, OpenGL ES 3.0 or later, and full-screen KMS/DRM
    output with no desktop environment.
  type: interface
  icd: ICD-013
  derives_from: [SYS-039, SYS-040]
  allocated_to: [eye-pi-left, eye-pi-right]
  verify: test
  source: CLAUDE.md "Current stage", Eye renderer constraints; ADR 0002 (open risk TBD-013)
  stage: 1
  status: proposed

- id: INF-002
  text: >-
    The porch Pi shall provide the platform specified in ICD-013 for the brain, Mosquitto
    and Falcon Player (whether FPP can share it: TBD-036).
  type: interface
  icd: ICD-013
  derives_from: [SYS-039]
  allocated_to: porch-pi
  verify: test
  source: architecture.md §3 "Where it runs, by stage"
  stage: 3
  status: proposed

- id: INF-003
  text: >-
    Each eye Pi shall have at least the memory that the software deployed on it needs.
  type: performance
  derives_from: [SYS-024, SYS-039]
  allocated_to: [eye-pi-left, eye-pi-right]
  verify: analysis
  verified_by: [tools/reqs/budget.py]
  source: owner 2026-11-09 (budget check); architecture.md §2 (1GB)
  stage: 1
  status: proposed

- id: INF-004
  text: >-
    The porch Pi shall have at least the memory that the software deployed on it needs
    (its size: TBD-031).
  type: performance
  derives_from: [SYS-039]
  allocated_to: porch-pi
  verify: analysis
  verified_by: [tools/reqs/budget.py]
  source: owner 2026-11-09 (budget check)
  stage: 3
  status: proposed

- id: INF-005
  text: >-
    The porch Pi shall provide a USB port for the USB audio adapter as specified in
    ICD-007.
  type: interface
  icd: ICD-007
  derives_from: [SYS-021]
  allocated_to: porch-pi
  verify: analysis
  verified_by: [tools/reqs/budget.py]
  source: architecture.md §3a "Audio output"
  stage: 3
  status: proposed

- id: INF-006
  text: >-
    Each eye Pi shall send its picture to its projector over HDMI as specified in ICD-014.
  type: interface
  icd: ICD-014
  derives_from: [SYS-024]
  allocated_to: [eye-pi-left, eye-pi-right]
  verify: test
  source: architecture.md §2
  stage: 1
  status: proposed

# ── Site config ─────────────────────────────────────────────────────────────────

- id: INF-007
  text: >-
    The site config shall hold the house's own settings, the same for every theme: the
    eye and radar positions in house coordinates, the head height, each eye's window
    settings, the approach and door zones, and the door point, as specified in ICD-015.
  type: interface
  icd: ICD-015
  derives_from: [SYS-004, SYS-035, SYS-047]
  allocated_to: site-config
  verify: inspection
  source: spec tree Q6; positions measured at install (TBD-018), door zone TBD-029
  stage: 0
  status: proposed

# ── Network ─────────────────────────────────────────────────────────────────────

- id: INF-008
  text: >-
    The home network shall give each networked node a reserved address and its friendly
    name (monster-brain, eye-left, eye-right, monster-lips, monster-radar), and keep its
    clock in sync, as specified in ICD-009.
  type: interface
  icd: ICD-009
  derives_from: [SYS-033, SYS-014]
  allocated_to: home-network
  verify: inspection
  rationale: Clocks must be right for show hours.
  source: architecture.md §8
  stage: 1
  status: proposed

- id: INF-009
  text: >-
    The home Wi-Fi shall reach the porch at 2.4 GHz well enough for the radar and lip
    nodes to stay connected (signal: TBD-008).
  type: performance
  derives_from: [SYS-033]
  allocated_to: home-network
  verify: test
  source: architecture.md §4 "Risks", §8
  stage: 2
  status: proposed

- id: INF-010
  text: >-
    The home network shall forward nothing from the internet to any part of the monster.
  type: constraint
  derives_from: [SYS-038]
  allocated_to: home-network
  verify: inspection
  source: architecture.md §8
  stage: 1
  status: proposed

# ── Power and mounting ──────────────────────────────────────────────────────────

- id: INF-011
  text: >-
    Power distribution shall give each box an outlet, using outdoor-rated cords and
    outlets on the porch, as specified in ICD-008.
  type: interface
  icd: ICD-008
  derives_from: [SYS-034, SYS-046]
  allocated_to: power-distribution
  verify: inspection
  source: architecture.md §1 design principle 2
  stage: 1
  status: proposed

- id: INF-012
  text: >-
    The eye pods shall be switched off at bedtime and on for the next show day (time and
    method TBD-025).
  type: functional
  derives_from: [SYS-018]
  allocated_to: power-distribution
  verify: demonstration
  notes: Allocated here on the assumption that it ends up as switched power (spec tree Q12); move it if TBD-025 decides otherwise.
  source: architecture.md §2 "Risks" (fan noise); spec tree Q12
  stage: 1
  status: proposed

- id: INF-013
  text: >-
    The porch mounting shall hold the outdoor boxes and route the audio cable from the
    porch Pi to the amp, removably, as specified in ICD-010.
  type: interface
  icd: ICD-010
  derives_from: [SYS-045, SYS-046]
  allocated_to: porch-mounting
  verify: inspection
  source: architecture.md §3 "Show-brain hardware" (cable through the door frame); TBD-010
  stage: 2
  status: proposed
