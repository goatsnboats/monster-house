# MTH Mouth subsystem requirements. Field meanings: README.md in this folder.

- id: MTH-001
  text: >-
    While Falcon Player is streaming, the lips shall show its frames; when it stops, WLED
    shall fall back on its own to a slow breathe effect (color per theme: TBD-035).
  type: functional
  derives_from: [SYS-001, SYS-011, SYS-013]
  allocated_to: wled
  allocation_rationale: >-
    Only WLED sees both FPP's stream and its own effect, so it does the switching.
  verify: demonstration
  rationale: The asleep "breathing" lips then need no extra work.
  source: architecture.md §5 "Software"
  stage: 4
  status: proposed

- id: MTH-002
  text: >-
    WLED shall limit the lips' brightness to the cap TBD-027.
  type: performance
  derives_from: [SYS-031]
  allocated_to: wled
  allocation_rationale: >-
    WLED's limiter caps the brightness whatever the source.
  verify: test
  source: architecture.md §5 "Risks" (neighbors and brightness)
  stage: 4
  status: proposed

- id: MTH-003
  text: >-
    WLED shall map segment 1 to the upper lip, segment 2 to the lower lip, and segments 3
    and 4 to the extras.
  type: functional
  derives_from: [SYS-011]
  allocated_to: wled
  allocation_rationale: >-
    Segments are a WLED setting.
  verify: inspection
  source: architecture.md §5 "Software"
  stage: 4
  status: proposed

- id: MTH-004
  text: >-
    The lower lip (on the railing) shall be IP65 strip in a closed channel, with sealed
    end caps and connectors.
  type: constraint
  derives_from: [SYS-046]
  allocated_to: lip-lower
  allocation_rationale: >-
    The lower lip on the railing gets the most weather (architecture §5).
  verify: inspection
  source: architecture.md §5 "Risks" (rain and snow)
  stage: 4
  status: proposed

- id: MTH-005
  text: >-
    The lip controller shall take lip frames from Falcon Player as specified in ICD-006.
  type: interface
  icd: ICD-006
  derives_from: [SYS-011]
  allocated_to: lip-controller
  allocation_rationale: >-
    The controller is the DDP receiver.
  verify: test
  source: architecture.md §5
  stage: 4
  status: proposed

- id: MTH-006
  text: >-
    The lip controller shall join the home Wi-Fi (2.4 GHz) with the name monster-lips, as
    specified in ICD-009.
  type: interface
  icd: ICD-009
  derives_from: [SYS-033]
  allocated_to: lip-controller
  allocation_rationale: >-
    The controller holds the lips' Wi-Fi connection.
  verify: inspection
  source: architecture.md §8
  stage: 4
  status: proposed

- id: MTH-007
  text: >-
    The lip supply shall plug into one household outlet as specified in ICD-008.
  type: interface
  icd: ICD-008
  derives_from: [SYS-034]
  allocated_to: lip-psu
  allocation_rationale: >-
    The 12 V supply is the lips' one connection to the mains.
  verify: inspection
  source: architecture.md §5 "Hardware"
  stage: 4
  status: proposed

- id: MTH-008
  text: >-
    The lip clips shall stay up all year, with the channels snapping on and off each
    season, as specified in ICD-010.
  type: interface
  icd: ICD-010
  derives_from: [SYS-045]
  allocated_to: lip-clips
  allocation_rationale: >-
    The clips are the only lip part that stays up all year.
  verify: demonstration
  source: architecture.md §5 "Hardware"
  stage: 4
  status: proposed

- id: MTH-009
  text: >-
    The lip supply shall provide at least the power the strips, extras and controller
    draw at the brightness cap (TBD-033).
  type: performance
  derives_from: [SYS-031]
  allocated_to: lip-psu
  allocation_rationale: >-
    The supply must cover the summed draw of everything it feeds (budget model).
  verify: analysis
  basis: {method: model, ref: tools/reqs/budget.py}
  verified_by: [tools/reqs/budget.py]
  source: architecture.md §5 "Hardware" (350 W, with WLED's limiter)
  stage: 4
  status: proposed

- id: MTH-010
  text: >-
    WLED shall show each lip frame within the lip path's share of SYS-022's limits
    (TBD-034).
  type: performance
  derives_from: [SYS-022]
  allocated_to: wled
  allocation_rationale: >-
    WLED's display delay is the lip path's hop in path P5.
  verify: test
  source: timing-budgets.md, path P5
  stage: 4
  status: proposed
