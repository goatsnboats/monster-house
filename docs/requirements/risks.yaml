# Risk register (SRR package, item 4). Approach and field meanings: risk-register.md here.
# Likelihood and impact are proposals for the owner to adjust (low, medium, high).
# A risk rated high on either must have a plan and a gate by which it is retired.

- id: RSK-001
  title: The eye renderer may not reach 60 fps, or run full-screen, on a real Pi 5
  likelihood: medium
  impact: high
  retire_by: CDR-1
  plan: Run the bench test on a real Pi before buying both pods; ADR 0002's fallback is Godot.
  events: [VE-101]
  tbds: [TBD-013]
  reqs: [SYS-024, SYS-040, INF-001]
  source: ADR 0002 (open risk); TS-002 results
  status: open

