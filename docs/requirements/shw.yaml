# SHW Show control subsystem requirements. Field meanings: README.md in this folder.
# Show control is software only: monster-brain, phone-page, falcon-player, mosquitto.

# ── monster-brain: moods ────────────────────────────────────────────────────────

- id: SHW-001
  text: >-
    The brain shall run the mood state machine Asleep → Waking → Greeting → Watching →
    Goodbye, with the transitions in architecture §3b and the timings from the theme.
  type: functional
  derives_from: [SYS-002, SYS-003, SYS-007, SYS-008]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b "Moods"
  stage: 0
  status: proposed

- id: SHW-002
  text: >-
    While Asleep, the brain shall keep the eyes in the asleep expression with an
    occasional droopy flutter, and trigger a snore clip at the theme's snore interval.
  type: functional
  derives_from: [SYS-001]
  allocated_to: monster-brain
  verify: demonstration
  source: architecture.md §3b, Moods table (Asleep)
  stage: 0
  status: proposed

- id: SHW-003
  text: >-
    When a visitor coming toward the house enters the approach zone, the brain shall
    start Waking within its share of SYS-020 (TBD-034): open the eyes, look around, lock
    on and trigger the wake clip.
  type: functional
  derives_from: [SYS-002, SYS-020]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b, Moods table (Waking)
  stage: 0
  status: proposed

- id: SHW-004
  text: >-
    When the wake clip finishes and a visitor is still present, the brain shall command
    the happy expression and trigger one clip from the greet pool.
  type: functional
  derives_from: [SYS-003]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b, Moods table (Greeting)
  stage: 0
  status: proposed

- id: SHW-005
  text: >-
    While Watching, the brain shall trigger a clip from the comment pool at a random
    interval within the theme's comment range.
  type: functional
  derives_from: [SYS-006]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b, Moods table (Watching)
  stage: 0
  status: proposed

# ── monster-brain: gaze ─────────────────────────────────────────────────────────

- id: SHW-006
  text: >-
    The brain shall convert each radar position (mm, radar-relative) to house
    coordinates (m) using the radar's mount position from the site config, and set the
    look height to the site config's head height.
  type: functional
  derives_from: [SYS-004]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b "Turning radar data into a gaze" steps 1-2
  stage: 0
  status: proposed

- id: SHW-007
  text: >-
    The brain shall smooth each visitor's position to remove radar jitter, adding no more
    delay than its share of SYS-019 (TBD-034).
  type: functional
  derives_from: [SYS-004, SYS-019]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b step 3
  stage: 0
  status: proposed

- id: SHW-008
  text: >-
    The brain shall choose one focus visitor: a new arrival wins; otherwise it holds on
    one visitor for a random 3-6 s, then switches; the closest visitor breaks ties.
  type: functional
  derives_from: [SYS-005]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b step 4
  stage: 0
  status: proposed

- id: SHW-009
  text: >-
    While a visitor is tracked, the brain shall publish the focus visitor's look point
    at about 10 times per second.
  type: performance
  derives_from: [SYS-028, SYS-019]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b step 5
  stage: 0
  status: proposed

- id: SHW-010
  text: >-
    The brain shall follow each visitor across radar updates as the same visitor, and
    mark each newly seen visitor as coming toward the house or going away from it.
  type: functional
  derives_from: [SYS-008, SYS-049, SYS-050]
  allocated_to: monster-brain
  verify: test
  notes: >-
    The LD2450 reports three target slots, not people; the brain matches slots to
    visitors. Coming vs going comes from the radar's direction or from position change
    (TBD-030).
  source: owner 2026-11-09 (coming vs going)
  stage: 0
  status: proposed

- id: SHW-011
  text: >-
    When a visitor is lost inside the door zone (site config), the brain shall keep them
    as a visitor at the door until they are seen again or the theme's door hold time
    (TBD-028) passes, and shall not count them as gone for the goodbye timer.
  type: functional
  derives_from: [SYS-047, SYS-007]
  allocated_to: monster-brain
  verify: test
  source: owner 2026-11-09 (door hold)
  stage: 0
  status: proposed

- id: SHW-012
  text: >-
    While a visitor is at the door, the brain shall aim the eyes at the door point from
    the site config, and may trigger clips from the theme's door pool.
  type: functional
  derives_from: [SYS-048]
  allocated_to: monster-brain
  verify: demonstration
  source: owner 2026-11-09
  stage: 0
  status: proposed

- id: SHW-013
  text: >-
    When a visitor is marked as going, the brain shall make that visitor the focus until
    they leave range and trigger one clip from the bye pool, keeping the minimum gap.
  type: functional
  derives_from: [SYS-049]
  allocated_to: monster-brain
  verify: test
  source: owner 2026-11-09
  stage: 0
  status: proposed

- id: SHW-014
  text: >-
    When a visitor is marked as coming while the monster is awake, the brain shall glance
    the eyes at them with the happy or surprised expression, and trigger a clip from the
    arrival pool if the pool has any, keeping the minimum gap.
  type: functional
  derives_from: [SYS-050, SYS-005]
  allocated_to: monster-brain
  verify: test
  source: owner 2026-11-09
  stage: 0
  status: proposed

# ── monster-brain: blinks, clips, rules ─────────────────────────────────────────

- id: SHW-015
  text: >-
    While awake, the brain shall command blinks for both eyes with one message at a
    random interval within the theme's blink range.
  type: functional
  derives_from: [SYS-009]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §2 "Blinks"
  stage: 0
  status: proposed

- id: SHW-016
  text: >-
    The brain shall pick clips from each pool in a shuffled order and not repeat a clip
    until every clip in that pool has played.
  type: functional
  derives_from: [SYS-015]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b "Variety and politeness rules"
  stage: 0
  status: proposed

- id: SHW-017
  text: >-
    The brain shall not start a clip until the theme's minimum gap has passed since the
    previous clip ended, except for clips the owner triggers from the phone.
  type: performance
  derives_from: [SYS-027]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b "Variety and politeness rules"
  stage: 0
  status: proposed

- id: SHW-018
  text: >-
    The brain shall handle failures as in architecture §3b: with the radar offline or
    silent for TBD-023, stay in an ambient mode (eyes idle, no greetings); with an eye
    pod offline, log it and carry on; with Falcon Player not responding, keep the eyes
    going without voice.
  type: functional
  derives_from: [SYS-017, SYS-029]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b "What happens when something fails"
  stage: 0
  status: proposed

- id: SHW-019
  text: >-
    Outside the theme's show hours (TBD-024), the brain shall stay Asleep and trigger no
    voice clips.
  type: functional
  derives_from: [SYS-014]
  allocated_to: monster-brain
  verify: test
  notes: Architecture §3a also mentions FPP's scheduler; the brain owning show hours keeps one schedule.
  source: architecture.md §3a "Schedule"
  stage: 0
  status: proposed

- id: SHW-020
  text: >-
    While muted, the brain shall trigger no voice clips and shall keep commanding the eyes.
  type: functional
  derives_from: [SYS-013]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b (mute)
  stage: 0
  status: proposed

- id: SHW-021
  text: >-
    When a theme is chosen, the brain shall load its settings and clip pools and publish
    the theme's name to the eyes.
  type: functional
  derives_from: [SYS-016]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §9 "Switching themes"
  stage: 0
  status: proposed

- id: SHW-022
  text: >-
    The brain shall publish its current mood whenever it changes, retained.
  type: functional
  derives_from: [SYS-012]
  allocated_to: monster-brain
  verify: test
  source: architecture.md §3b "Outputs"
  stage: 0
  status: proposed

- id: SHW-023
  text: >-
    The brain shall act on a phone button within its share of SYS-023's 0.5 s (TBD-034).
  type: performance
  derives_from: [SYS-023]
  allocated_to: monster-brain
  verify: test
  source: timing-budgets.md, path P4
  stage: 0
  status: proposed

